version: '3'

vars:
  # Must differ from "tunnel" (the bundled CLI) so both fit in Contents/MacOS/
  # on case-insensitive filesystems.
  APP_NAME: "tunnel-app"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  # App version shown in 关于 Tunnel, injected as main.version. Release CI
  # passes VERSION=<tag without the v>; local builds stay "dev".
  VERSION: '{{.VERSION | default "dev"}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  bundle:tunnel:
    summary: Builds the tunnel CLI (../cli, same commit) into bin/ so packaging can ship it next to the app
    vars:
      # Version of the bundled CLI. If ../cli is unchanged since the nearest
      # version tag (v*, or a legacy cli/v*), it is that tag (e.g. "v1.5.0");
      # otherwise `git describe` of the last commit that touched ../cli
      # (e.g. "v1.4.0-3-gabc1234"). Desktop-only commits leave it unchanged, so
      # the app does not ask to update the share service for nothing. Needs
      # full history (CI: fetch-depth 0); falls back to "dev", which turns the
      # app's outdated-service check off.
      CLI_DESCRIBE:
        sh: |
          t=$(git describe --tags --abbrev=0 --match "cli/v*" --match "v[0-9]*" 2>/dev/null) || t=""
          if [ -n "$t" ] && git diff --quiet "$t" HEAD -- ../cli 2>/dev/null; then
            echo "$t"
          else
            c=$(git log -1 --format=%H -- ../cli 2>/dev/null) || c=HEAD
            git describe --tags --match "cli/v*" --match "v[0-9]*" "$c" 2>/dev/null || echo dev
          fi
      TUNNEL_VERSION: '{{trimPrefix "cli/" .CLI_DESCRIBE}}'
      TARGET_OS: '{{.GOOS}}'
      EXE: '{{if eq .GOOS "windows"}}.exe{{end}}'
    cmds:
      - mkdir -p "{{.BIN_DIR}}"
      - go build -trimpath -ldflags "-X github.com/pangxincheng/tunnel/cli/tunnel.Version={{.TUNNEL_VERSION}}" -o "{{.BIN_DIR}}/tunnel{{.EXE}}" github.com/pangxincheng/tunnel/cli/cmd/tunnel
    env:
      CGO_ENABLED: "0"
      GOOS: '{{.TARGET_OS}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  build:
    summary: Builds the application
    deps:
      - bundle:tunnel
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    deps:
      - bundle:tunnel
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
