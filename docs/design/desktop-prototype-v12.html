<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Tunnel 可交互原型 v12</title>
<style>
  :root {
    --ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    --code: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  /* ---------- theme tokens ---------- */
  .app { --canvas:#F3F4F6; --side:#ECEEF1; --surface:#FFFFFF; --ink:#16191D; --muted:#6A717B; --faint:#9AA1AA; --line:#E1E4E8;
         --fault:#B3422E; --fault-soft:#F8E9E5; --fault-ink:#7A2B1D; --hover:rgba(22,25,29,.05); --sel:rgba(22,25,29,.07); --scrim:rgba(22,25,29,.28); --shadow:rgba(22,25,29,.12); }
  .app.dark { --canvas:#1A1C20; --side:#15171A; --surface:#23262B; --ink:#E8EAED; --muted:#A0A7B0; --faint:#6E757E; --line:#2F3338;
              --fault:#E06A52; --fault-soft:#3A221D; --fault-ink:#F3B3A6; --hover:rgba(255,255,255,.04); --sel:rgba(255,255,255,.08); --scrim:rgba(0,0,0,.5); --shadow:rgba(0,0,0,.5); }
  .app[data-accent="green"]    { --live:#13795B; } .app.dark[data-accent="green"]    { --live:#3DBE8B; }
  .app[data-accent="blue"]     { --live:#2457D6; } .app.dark[data-accent="blue"]     { --live:#6E9BFF; }
  .app[data-accent="violet"]   { --live:#6544E0; } .app.dark[data-accent="violet"]   { --live:#A592FF; }
  .app[data-accent="amber"]    { --live:#A85A06; } .app.dark[data-accent="amber"]    { --live:#F0A24B; }
  .app[data-accent="graphite"] { --live:#3E4651; } .app.dark[data-accent="graphite"] { --live:#C9CFD7; }
  .app { --live-soft:color-mix(in srgb, var(--live) 14%, transparent); }

  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--ui); background:#C9CED4; color:#16191D; min-height:100vh; padding:24px; -webkit-font-smoothing:antialiased; }
  body.fs { padding:0; }
  button, input, select { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--live); outline-offset:2px; }

  .demo { max-width:1100px; margin:0 auto 14px; display:flex; gap:18px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; color:#2b3138; }
  .demo h1 { font-size:16px; font-weight:600; }
  .demo p { font-size:12.5px; color:#46505a; margin-top:4px; max-width:620px; line-height:1.55; }
  .demo .ctl { display:flex; gap:6px; flex-wrap:wrap; }
  .demo .ctl button { border:0; background:rgba(255,255,255,.6); padding:6px 10px; border-radius:7px; font-size:12px; cursor:pointer; }
  .demo .ctl button.sel { background:#fff; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.12); }
  body.fs .demo { display:none; }

  /* ---------- window ---------- */
  .app { width:940px; height:600px; min-width:720px; min-height:460px; max-width:100%; margin:0 auto; resize:both; overflow:hidden;
         background:var(--canvas); color:var(--ink); border-radius:11px; box-shadow:0 22px 50px rgba(22,25,29,.25), 0 0 0 .5px rgba(22,25,29,.35);
         display:grid; grid-template-columns:240px 1fr; position:relative; }
  body.fs .app { width:100vw !important; height:100vh !important; max-width:none; border-radius:0; resize:none; }
  .sidebar { background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .side-top { height:46px; display:flex; align-items:center; padding:0 12px; gap:8px; flex:none; }
  .lights { display:flex; gap:7px; } .lights i { width:12px; height:12px; border-radius:50%; display:block; background:#D5D8DC; }
  .lights i.full { cursor:pointer; } .app.dark .lights i { background:#3a3e44; }
  .side-title { font-size:11.5px; color:var(--muted); padding:6px 16px 4px; }
  .servers { flex:1; overflow:auto; padding:0 8px; }
  .srv { width:100%; display:flex; align-items:center; gap:6px; padding:8px 8px 8px 10px; border-radius:7px; }
  .srv:hover { background:var(--hover); } .srv.sel { background:var(--sel); }
  .srv .n { font-size:13px; font-weight:500; } .srv .m { font-size:11.5px; color:var(--muted); margin-top:1px; }
  .srv { position:relative; }
  .srv-main { flex:1; min-width:0; display:flex; align-items:center; gap:10px; border:0; background:none; text-align:left; cursor:pointer; padding:0; }
  .srv-acts { display:none; gap:2px; flex:none; }
  .srv:hover .srv-acts, .srv:focus-within .srv-acts, .srv.sel .srv-acts { display:flex; }
  .sa { width:24px; height:24px; border:0; border-radius:5px; background:none; color:var(--muted); cursor:pointer; display:grid; place-items:center; }
  .sa:hover { background:var(--surface); color:var(--ink); box-shadow:0 0 0 .5px var(--shadow); }
  .sa.danger:hover { color:var(--fault); }
  .sa.on { color:var(--live); }
  .banner.paused { background:var(--sel); color:var(--ink); }
  .btn.dangerfill { background:var(--fault); color:#fff; }
  .side-bottom { display:flex; align-items:center; gap:6px; padding:10px 10px 12px; border-top:1px solid var(--line); flex:none; }
  .addbtn { flex:1; height:30px; border:0; border-radius:7px; background:var(--surface); box-shadow:0 0 0 .5px var(--shadow); cursor:pointer; font-size:12.5px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .addbtn:hover { background:var(--canvas); }
  .icon { width:30px; height:30px; border:0; border-radius:7px; background:transparent; cursor:pointer; display:grid; place-items:center; color:var(--muted); flex:none; }
  .icon:hover { background:var(--hover); color:var(--ink); }

  .main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .main-top { height:46px; display:flex; align-items:center; padding:0 20px; gap:12px; border-bottom:1px solid var(--line); flex:none; }
  .main-top .t { font-size:14px; font-weight:600; } .main-top .h { font-size:12px; color:var(--muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ghost { height:28px; padding:0 10px; border:1px solid var(--line); border-radius:6px; background:var(--surface); cursor:pointer; font-size:12px; white-space:nowrap; }
  .ghost:hover { background:var(--canvas); }
  .content { flex:1; overflow:auto; padding:6px 20px 24px; }
  .col { max-width:680px; }

  .sec { margin-top:16px; }
  .sec-head { padding:0 4px 6px; display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .sec-head .t { font-size:12px; font-weight:600; } .sec-head .s { font-size:11.5px; color:var(--faint); white-space:nowrap; }
  .list { background:var(--surface); border-radius:9px; box-shadow:0 0 0 .5px var(--shadow); overflow:hidden; }
  .item + .item { border-top:1px solid var(--line); }
  .drow { display:flex; align-items:center; gap:10px; padding:0 12px; height:54px; }
  .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .dot.on { background:var(--live); } .dot.off { box-shadow:inset 0 0 0 1.5px var(--faint); } .dot.err { background:var(--fault); } .dot.idle { background:var(--faint); opacity:.6; }
  .grow { flex:1; min-width:0; }
  .name { font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .name .tag { font-size:11px; color:var(--muted); font-weight:400; margin-left:8px; }
  .meta { font-size:11.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gap { display:inline-block; width:10px; }
  #dlg { display:contents; }
  .app { grid-template-rows:100%; }
  .meta.err { color:var(--fault); } .meta.live { color:var(--live); }
  .item.offline .name, .list.stale .name { color:var(--muted); }
  .list.stale { opacity:.7; }

  .conn { display:flex; align-items:center; gap:8px; }
  .chip { font-family:var(--code); font-size:15px; font-weight:500; border:1px solid transparent; background:none; color:var(--faint); border-radius:6px; padding:2px 6px; cursor:text; }
  .chip.on { color:var(--live); } .chip:hover { border-color:var(--line); background:var(--canvas); }
  .inp { height:28px; padding:0 8px; border:1px solid var(--line); border-radius:6px; background:var(--canvas); color:var(--ink); outline:none; font-size:12.5px; transition:border-color .15s, box-shadow .15s, background .15s; }
  .inp:hover { border-color:var(--faint); }
  .inp:focus { border-color:var(--live); background:var(--surface); box-shadow:0 0 0 3px var(--live-soft); }
  .inp.bad { border-color:var(--fault); box-shadow:0 0 0 3px var(--fault-soft); }
  .inp.num { font-family:var(--code); font-size:15px; width:72px; }
  .vsep { width:1px; height:22px; background:var(--line); flex:none; margin:0 2px; }
  .copy { width:28px; height:28px; border:0; border-radius:6px; background:none; color:var(--muted); cursor:pointer; display:grid; place-items:center; flex:none; }
  .copy:hover { background:var(--canvas); color:var(--ink); }
  .sw { width:34px; height:20px; border-radius:10px; background:var(--line); position:relative; flex:none; border:0; cursor:pointer; transition:background .18s; }
  .app:not(.dark) .sw { background:#D3D7DC; }
  .sw::after { content:""; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:2px; left:2px; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:left .18s; }
  .sw[aria-checked="true"], .app:not(.dark) .sw[aria-checked="true"] { background:var(--live); } .sw[aria-checked="true"]::after { left:16px; }
  .sw:disabled { opacity:.35; cursor:not-allowed; }
  .perr { padding:0 12px 10px 30px; font-size:11.5px; color:var(--fault); margin-top:-6px; }

  .sub { border-top:1px solid var(--line); padding:0 12px; }
  .frow { display:flex; align-items:center; gap:12px; height:48px; }
  .frow + .frow { border-top:1px solid var(--line); }
  .frow .lbl { font-size:12.5px; flex:1; min-width:0; }
  .frow .lbl small { display:block; font-size:11.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ferr { font-size:11.5px; color:var(--fault); padding:0 0 10px; margin-top:-6px; }
  .check { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); height:38px; border-top:1px solid var(--line); }
  .tick { width:14px; height:14px; border-radius:50%; background:var(--live-soft); color:var(--live); display:grid; place-items:center; font-size:10px; font-weight:700; }
  .banner { margin-top:14px; display:flex; align-items:center; gap:12px; background:var(--fault-soft); color:var(--fault-ink); border-radius:9px; padding:10px 12px; font-size:12.5px; }
  .banner .grow div + div { font-size:11.5px; opacity:.85; margin-top:2px; }
  .errbox { margin:0 12px 12px; background:var(--fault-soft); color:var(--fault-ink); font-size:12px; line-height:1.5; padding:8px 10px; border-radius:7px; }
  .lb { font-size:12px; color:var(--live); background:none; border:0; cursor:pointer; padding:2px 4px; border-radius:4px; white-space:nowrap; }
  .lb.quiet { color:var(--muted); }
  .mono { font-family:var(--code); font-size:11.5px; }
  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; height:100%; padding:0 40px; }
  .empty h2 { font-size:15px; font-weight:600; } .empty p { font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.6; max-width:320px; }
  .btn { font-size:13px; font-weight:500; border:0; border-radius:7px; padding:7px 16px; cursor:pointer; }
  .btn.primary { background:var(--ink); color:var(--canvas); } .btn.primary:disabled { opacity:.35; cursor:not-allowed; }
  .btn.plain { background:var(--surface); box-shadow:0 0 0 .5px var(--shadow), 0 0 0 1px var(--line) inset; }
  .btn.danger { background:none; color:var(--fault); padding-left:0; }

  /* dialogs */
  .scrim { position:absolute; inset:0; background:var(--scrim); display:flex; align-items:center; justify-content:center; padding:24px; z-index:20; animation:fade .15s ease-out; }
  .dlg { width:min(460px, 100%); max-height:100%; background:var(--canvas); border-radius:12px; box-shadow:0 18px 40px var(--shadow), 0 0 0 .5px var(--shadow); display:flex; flex-direction:column; overflow:hidden; animation:pop .16s ease-out; }
  .dlg.wide { width:min(560px, 100%); }
  .dlg-h { padding:16px 18px 4px; } .dlg-h .t { font-size:14px; font-weight:600; } .dlg-h .s { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .dlg-b { padding:4px 18px 14px; overflow:auto; }
  .dlg-f { display:flex; justify-content:flex-end; align-items:center; gap:8px; padding:12px 18px; border-top:1px solid var(--line); }
  .dlg-f .left { margin-right:auto; }
  .field { padding:0 12px; height:46px; display:grid; grid-template-columns:96px 1fr; align-items:center; gap:10px; }
  .field + .field { border-top:1px solid var(--line); }
  .field label { font-size:12.5px; color:var(--muted); }
  .field .inp { width:100%; }
  .hint { font-size:11.5px; color:var(--faint); padding:6px 4px 0; line-height:1.5; }
  .fp { margin-top:12px; background:var(--surface); border-radius:9px; box-shadow:0 0 0 .5px var(--shadow); padding:12px; }
  .fp .t { font-size:12.5px; font-weight:500; } .fp code { display:block; font-family:var(--code); font-size:11.5px; margin-top:6px; overflow-wrap:anywhere; }
  .fp p { font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.5; } .fp .ok { font-size:12px; color:var(--live); margin-top:8px; }
  .tests { margin-top:10px; font-size:12px; line-height:1.9; color:var(--muted); padding:0 4px; } .tests b { color:var(--live); margin-right:6px; }
  .cmdlist .c { display:grid; grid-template-columns:64px 1fr auto; gap:10px; align-items:center; padding:8px 12px; }
  .cmdlist .c + .c { border-top:1px solid var(--line); }
  .cmdlist .k { font-size:12px; color:var(--muted); } .cmdlist code { font-family:var(--code); font-size:11.5px; overflow-wrap:anywhere; }
  .ph { color:var(--faint); } .ph.user { color:var(--live); }
  .seg { display:inline-flex; background:var(--sel); border-radius:7px; padding:2px; }
  .seg button { font-size:12px; border:0; background:none; color:var(--muted); padding:4px 12px; border-radius:5px; cursor:pointer; }
  .seg button.sel { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px var(--shadow); }
  .swatches { display:flex; gap:10px; }
  .swatch { width:20px; height:20px; border-radius:50%; border:0; cursor:pointer; box-shadow:0 0 0 1px var(--shadow); }
  .swatch.sel { box-shadow:0 0 0 2px var(--canvas), 0 0 0 4px var(--live); }
  select.inp { width:auto; padding-right:24px; }
  .toast { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); background:var(--ink); color:var(--canvas); font-size:12px; padding:7px 12px; border-radius:7px; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; z-index:30; }
  .toast.show { opacity:1; }
  .spinner { display:inline-block; width:11px; height:11px; border:1.5px solid var(--faint); border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; vertical-align:-1px; margin-right:6px; }
  @keyframes spin { to { transform:rotate(360deg); } } @keyframes fade { from { opacity:0; } } @keyframes pop { from { transform:scale(.97); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .scrim, .dlg, .sw, .sw::after, .spinner { animation:none; transition:none; } }
</style>
</head>
<body>
<div class="demo">
  <div>
    <h1>可交互原型 v12</h1>
    <p>窗口右下角可以拖动调整大小(最小 720×460),第三个窗口按钮切换全屏(Esc 退出)。鼠标移到侧边栏的服务器上,右侧出现 编辑 / 连接·断开 / 删除。jp-vps 演示服务器连不上;win-desktop 离线,不能打开转发。</p>
  </div>
  <div class="ctl"><button data-scen="fresh">首次打开</button><button data-scen="ready" class="sel">已配置 3 台服务器</button></div>
</div>
<div class="app" id="app" data-accent="green">
  <aside class="sidebar" id="sidebar"></aside>
  <section class="main" id="main"></section>
  <div id="dlg"></div>
  <div class="toast" id="toast"></div>
</div>

function cmds(p) {

          ['rsync', `rsync -av -e "ssh -p ${p}" ${ph('src')} ${at}:${ph('dst')}`], ['sftp', `sftp -P ${p} ${at}`], [T('addr'), `127.0.0.1:${p}`]];
}
const NAME_RE = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/;
function formErr(f) { if (!NAME_RE.test(f.id)) return T('nameBad'); if (S.vps.some(v => v.id === f.id && v.id !== f.edit)) return T('nameDup',{n:esc(f.id)}); return ''; }

  const app = document.getElementById('app');
  const dark = S.mode === 'dark' || (S.mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  app.classList.toggle('dark', dark); app.dataset.accent = S.accent; document.documentElement.lang = S.lang === 'zh' ? 'zh-CN' : 'en';
  const sc = document.querySelector('.content'), keep = sc ? sc.scrollTop : 0;
  document.getElementById('sidebar').innerHTML = sidebar();
  document.getElementById('main').innerHTML = main();
  const sc2 = document.querySelector('.content'); if (sc2) sc2.scrollTop = keep;
  document.getElementById('dlg').innerHTML = dialog();
}
function renderDlg(sel) { document.getElementById('dlg').innerHTML = dialog(); if (sel) { const i = document.querySelector(sel); if (i) { i.focus(); const n = i.value.length; i.setSelectionRange(n, n); } } }

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const sc = e.target.closest('[data-scen]');
  if (sc) { document.querySelectorAll('[data-scen]').forEach(b => b.classList.toggle('sel', b === sc)); reset(sc.dataset.scen); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return;
  if (el.classList.contains('scrim') && e.target !== el) return;
  const a = el.dataset.act, v = el.dataset.v;
  switch (a) {
    case 'pick': S.cur = v; S.editing = null; render(); break;
    case 'add': S.dlg = { type:'form', id: S.vps.length ? 'new-vps' : 'home-vps', host:'vps.example.com', port:'22', user:'tunnel', key:'~/.ssh/id_ed25519', edit:null, tested:false, trusted:false }; renderDlg('#f-id'); break;
    case 'edit': { const x = vpsOf(v); S.dlg = { type:'form', ...x, edit:v, tested:true, trusted:true }; renderDlg('#f-host'); break; }
    case 'settings': S.dlg = { type:'settings' }; renderDlg(); break;
    case 'close': S.dlg = null; render(); break;
    case 'fullscreen': document.body.classList.toggle('fs'); break;
    case 'set': S[el.dataset.k] = v; render(); break;
    case 'toggleSet': S[el.dataset.k] = !S[el.dataset.k]; renderDlg(); break;
    case 'share': { const s = sh(v); if (!s.on && (MACHINES[v] || []).some(m => m.name === (S.selfName[v] || SELF))) { toast(T('nameTaken',{n:S.selfName[v] || SELF, v})); return; }
      s.on = !s.on; if (s.on && !vpsOf(v).down) { s.state = 'connecting'; render(); setTimeout(() => { s.state = 'ok'; render(); }, 1100); } else render(); break; }
    case 'sys': sh(v).sys = !sh(v).sys; render(); break;
    case 'retryShare': sh(v).state = 'connecting'; render(); setTimeout(() => { sh(v).state = 'ok'; render(); }, 1100); break;
    case 'retryVps': S.retry = 30; render(); toast(S.lang === 'zh' ? '仍然无法连接,30 秒后再试' : 'Still unreachable, retrying in 30s'); break;
    case 'fwd': { const [vid, name] = v.split('/'), m = MACHINES[vid].find(x => x.name === name), online = m.online && !vpsOf(vid).down;
      if (S.fwd[v]) { delete S.fwd[v]; toast(T('fwdOff')); } else if (!online) { toast(T('cantOffline',{n:name})); return; } else { S.fwd[v] = true; toast(T('fwdOn',{p:S.ports[v]})); } render(); break; }
    case 'editPort': S.editing = v; render(); { const i = document.querySelector(`[data-port="${v}"]`); if (i) { i.focus(); i.select(); } } break;
    case 'cmds': S.dlg = { type:'cmds', k:v }; renderDlg(); break;
    case 'copyCmd': { const c = cmds(S.ports[S.dlg.k])[Number(v)][1].replace(/<[^>]+>/g, '').replace(/&lt;/g,'<').replace(/&gt;/g,'>'); toast(T('copied') + ': ' + c); break; }
    case 'test': S.dlg.testing = true; S.dlg.tested = S.dlg.trusted = false; renderDlg(); setTimeout(() => { if (!S.dlg) return; S.dlg.testing = false; S.dlg.tested = true; renderDlg(); }, 900); break;
    case 'trust': S.dlg.trusted = true; renderDlg(); break;
    case 'saveSrv': { const f = S.dlg, item = { id:f.id, host:f.host, port:f.port, user:f.user, key:f.key, down:false };
      if (!MACHINES[f.id]) MACHINES[f.id] = structuredClone(MACHINES['home-vps']);
      if (f.edit) { const i = S.vps.findIndex(x => x.id === f.edit); item.down = S.vps[i].down; S.vps[i] = item; } else S.vps.push(item);
      S.cur = f.id; S.dlg = null; assignPorts(); render(); toast(T(f.edit ? 'saved' : 'added', {n:f.id})); break; }
    case 'askRemove': S.dlg = { type:'confirmRemove', v }; renderDlg(); { const b = document.querySelector('.dlg .btn.plain'); if (b) b.focus(); } break;
    case 'togglePause': { const x = vpsOf(v); x.paused = !x.paused; S.cur = v; render(); toast(T(x.paused ? 'disconnectedFrom' : 'connectedTo', {v})); break; }
    case 'remove': S.vps = S.vps.filter(x => x.id !== v); S.cur = S.vps[0] ? S.vps[0].id : null; S.dlg = null; render(); toast(T('removed',{n:v})); break;
    case 'toast': toast(T('logs')); break;
  }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.field;
  if (k && S.dlg) { S.dlg[k] = e.target.value; if (k !== 'id') S.dlg.tested = S.dlg.trusted = false; renderDlg(`[data-field="${k}"]`); }
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-setlang]')) { S.lang = e.target.value === 'auto' ? (navigator.language.startsWith('zh') ? 'zh' : 'en') : e.target.value; render(); return; }
  const pk = e.target.dataset.port;
  if (pk) { const val = e.target.value.trim(), msg = portErr(pk, val);
    if (msg) S.portErr[pk] = { v:val, msg }; else { delete S.portErr[pk]; S.editing = null; const ch = S.ports[pk] !== Number(val); S.ports[pk] = Number(val); if (ch) toast(`→ ${val}`); }
    render(); const i = document.querySelector(`[data-port="${pk}"]`); if (i) i.focus(); return; }
  const id = e.target.dataset.selfname; if (id) { S.selfName[id] = e.target.value.trim() || SELF; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.dlg) { S.dlg = null; render(); } else if (S.editing) { delete S.portErr[S.editing]; S.editing = null; render(); } else document.body.classList.remove('fs'); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.port) e.target.blur();
});
document.addEventListener('focusout', e => { const pk = e.target.dataset && e.target.dataset.port; if (pk && !S.portErr[pk] && Number(e.target.value) === S.ports[pk]) { S.editing = null; setTimeout(render); } });
setInterval(() => { if (S.vps && S.vps.some(v => v.down)) { S.retry = S.retry > 1 ? S.retry - 1 : 30; document.querySelectorAll('.cd').forEach(n => n.textContent = T('retryIn',{s:S.retry})); } }, 1000);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());
reset('ready');
</script>
