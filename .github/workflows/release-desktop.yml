# 桌面端发布工作流:推送形如 desktop/v1.2.3(可带 -beta.1 这类后缀)的 tag 即触发
# (命令行用 cli/v*,见 release-cli.yml)。桌面端代码在 desktop/,经 replace 直接使用同一提交的 cli/。
# 流程:测试 → 4 个安装包并行构建 → 汇总、生成版本说明、创建 GitHub Release。
#
#   macOS arm64 / amd64   .dmg            macos-latest(Apple 芯片,amd64 交叉编译)
#   Windows amd64         NSIS 安装程序    ubuntu(无 CGO,交叉编译 + apt 的 makensis)
#   Linux amd64           .deb / .rpm      ubuntu
#
# 版本号取自 tag(去掉 desktop/ 与 v):注入 main.version(「关于 Tunnel」显示),并由
# desktop/build/set_version.py 写进 Info.plist、Windows 版本信息与 nfpm。附带的 tunnel CLI
# 版本由 git describe 得出(需完整历史)。版本说明见 .github/scripts/desktop-release-notes.sh。
# 带 - 的 tag 发布为预发布版本。
name: release-desktop

on:
  push:
    tags:
      - "desktop/v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: 安装 Linux 构建依赖(GTK4 + WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev

      - name: 前端测试与构建
        working-directory: desktop/frontend
        run: |
          npm ci
          npm test
          npx tsc --noEmit
          npm run build

      - name: Go 测试(桌面端与其依赖的 cli/)
        run: |
          go test ./... -count=1
          (cd ../cli && go test ./... -count=1)

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos_arm64, runner: macos-latest, arch: arm64 }
          - { target: macos_amd64, runner: macos-latest, arch: amd64 }
          - { target: windows_amd64, runner: ubuntu-24.04, arch: amd64 }
          - { target: linux_amd64, runner: ubuntu-24.04, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # bundle:tunnel 用 git describe 给附带的 CLI 定版本

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      # Linux 上 wails3 命令行本身也链接 GTK4 / WebKitGTK,两个 ubuntu 任务都要在安装它之前装好。
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev

      - name: 安装 wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: 写入版本号
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#desktop/}"   # v1.2.3,用于文件名
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$(python3 build/set_version.py "$TAG_VERSION")" >> "$GITHUB_ENV"

      - name: 安装 NSIS
        if: matrix.target == 'windows_amd64'
        run: sudo apt-get install -y nsis

      - name: 打包 macOS(.dmg)
        if: startsWith(matrix.target, 'macos_')
        run: |
          wails3 task darwin:package:dmg ARCH=${{ matrix.arch }} VERSION="$VERSION"
          mkdir -p dist
          mv bin/tunnel-app.dmg "dist/tunnel-app_${TAG_VERSION}_${{ matrix.target }}.dmg"

      - name: 打包 Windows(NSIS 安装程序)
        if: matrix.target == 'windows_amd64'
        run: |
          wails3 task windows:package ARCH=amd64 GOOS=windows VERSION="$VERSION"
          mkdir -p dist
          mv bin/tunnel-app-amd64-installer.exe "dist/tunnel-app_${TAG_VERSION}_windows_amd64_installer.exe"

      - name: 打包 Linux(.deb / .rpm)
        if: matrix.target == 'linux_amd64'
        env:
          GOARCH: amd64 # nfpm.yaml 的 arch 取自该变量
        run: |
          wails3 task linux:create:deb ARCH=amd64 VERSION="$VERSION"
          wails3 task linux:create:rpm ARCH=amd64 VERSION="$VERSION"
          mkdir -p dist
          mv bin/*.deb "dist/tunnel-app_${TAG_VERSION}_linux_amd64.deb"
          mv bin/*.rpm "dist/tunnel-app_${TAG_VERSION}_linux_amd64.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: desktop/dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 版本说明要找上一个 tag 并比较 CHANGELOG

      # actions/checkout 只取 tag 指向的提交,附注 tag 的说明要单独取回。
      - name: 取回附注 tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: 生成版本说明
        run: .github/scripts/desktop-release-notes.sh "$GITHUB_REF_NAME" > notes.md

      # --notes 的内容放在最前,GitHub 自动生成的 PR 列表与对比链接接在后面。
      # 对比起点限定为上一个 desktop/v* tag(否则可能取到 cli/v* 的发布);
      # 第一次发布没有起点,不追加自动生成的部分。
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          case "$GITHUB_REF_NAME" in *-*) extra+=(--prerelease) ;; esac
          prev="$(git describe --tags --abbrev=0 --match 'desktop/v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then extra+=(--generate-notes --notes-start-tag "$prev"); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Tunnel 桌面端 ${GITHUB_REF_NAME#desktop/}" \
            --notes "$(cat notes.md)" \
            "${extra[@]}"
