# 桌面端发布工作流:推送形如 v1.2.3(可带 -beta.1 这类后缀)的 tag 即触发。
# 流程:测试 → 4 个安装包并行构建 → 汇总、生成版本说明、创建 GitHub Release。
#
#   macOS arm64 / amd64   .dmg            macos-latest(Apple 芯片,amd64 交叉编译)
#   Windows amd64         NSIS 安装程序    ubuntu(无 CGO,交叉编译 + apt 的 makensis)
#   Linux amd64           .deb / .rpm      ubuntu
#
# 版本号取自 tag(去掉开头的 v):注入 main.version(「关于 Tunnel」显示),并由
# desktop/build/set_version.py 写进 Info.plist、Windows 版本信息与 nfpm。
# 版本说明见 .github/scripts/release-notes.sh。带 - 的 tag 发布为预发布版本。
name: release-desktop

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: 检查 go.mod 没有 replace 到本地检出
        run: |
          if grep -qE '^\s*replace\s+github\.com/pangxincheng/tunnel\b' go.mod; then
            echo "::error file=desktop/go.mod::go.mod 仍把 tunnel replace 到本地目录,CI 中无法构建。先给 tunnel 打 tag,再改为 require 该版本并 go mod tidy。"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: 安装 Linux 构建依赖(GTK4 + WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev

      - name: 前端测试与构建
        working-directory: desktop/frontend
        run: |
          npm ci
          npm test
          npx tsc --noEmit
          npm run build

      - name: Go 测试
        run: go test ./... -count=1

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos_arm64, runner: macos-latest, arch: arm64 }
          - { target: macos_amd64, runner: macos-latest, arch: amd64 }
          - { target: windows_amd64, runner: ubuntu-24.04, arch: amd64 }
          - { target: linux_amd64, runner: ubuntu-24.04, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: 安装 wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: 写入版本号
        run: echo "VERSION=$(python3 build/set_version.py "$GITHUB_REF_NAME")" >> "$GITHUB_ENV"

      - name: 安装 Linux 构建依赖
        if: matrix.target == 'linux_amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev

      - name: 安装 NSIS
        if: matrix.target == 'windows_amd64'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: 打包 macOS(.dmg)
        if: startsWith(matrix.target, 'macos_')
        run: |
          wails3 task darwin:package:dmg ARCH=${{ matrix.arch }} VERSION="$VERSION"
          mkdir -p dist
          mv bin/tunnel-app.dmg "dist/tunnel-app_${GITHUB_REF_NAME}_${{ matrix.target }}.dmg"

      - name: 打包 Windows(NSIS 安装程序)
        if: matrix.target == 'windows_amd64'
        run: |
          wails3 task windows:package ARCH=amd64 GOOS=windows VERSION="$VERSION"
          mkdir -p dist
          mv bin/tunnel-app-amd64-installer.exe "dist/tunnel-app_${GITHUB_REF_NAME}_windows_amd64_installer.exe"

      - name: 打包 Linux(.deb / .rpm)
        if: matrix.target == 'linux_amd64'
        env:
          GOARCH: amd64 # nfpm.yaml 的 arch 取自该变量
        run: |
          wails3 task linux:create:deb ARCH=amd64 VERSION="$VERSION"
          wails3 task linux:create:rpm ARCH=amd64 VERSION="$VERSION"
          mkdir -p dist
          mv bin/*.deb "dist/tunnel-app_${GITHUB_REF_NAME}_linux_amd64.deb"
          mv bin/*.rpm "dist/tunnel-app_${GITHUB_REF_NAME}_linux_amd64.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: desktop/dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 版本说明要找上一个 tag 并比较 CHANGELOG

      # actions/checkout 只取 tag 指向的提交,附注 tag 的说明要单独取回。
      - name: 取回附注 tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: 生成版本说明
        run: .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md

      # --notes 的内容放在最前,GitHub 自动生成的 PR 列表与对比链接接在后面。
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Tunnel $GITHUB_REF_NAME" \
            --notes "$(cat notes.md)" \
            --generate-notes \
            $pre
